name: Authorized Vercel release

# Preparation only by default: pushes/merges NEVER deploy.
# A later authorized operator must enable repository flags, record a release
# reference, and configure required-reviewer protection on staging/production.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Previously authorized deployment target"
        required: true
        default: preview
        type: choice
        options: [preview, production]
      operator_authorized:
        description: "I have authorization and completed the target's release checklist"
        required: true
        default: false
        type: boolean
      release_reference:
        description: "Approved release/change reference (no credentials or personal data)"
        required: true
        type: string

concurrency:
  group: vercel-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Authorized build and release
    # Missing flags/acknowledgement fail closed. No secrets are installed by V4.
    if: >-
      ${{ inputs.operator_authorized == true && inputs.release_reference != '' &&
          vars.VIDYA_DEPLOYMENT_ENABLED == 'true' &&
          (inputs.target == 'preview' ||
           (inputs.target == 'production' && vars.VIDYA_PRODUCTION_RELEASE_APPROVED == 'true')) }}
    environment:
      # Reuse the existing GitHub environments; Vercel TARGET remains lowercase.
      name: ${{ inputs.target == 'production' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET: ${{ inputs.target }}
      RELEASE_REFERENCE: ${{ inputs.release_reference }}
    steps:
      - name: Confirm explicit release preconditions
        run: |
          set -eu
          # Values never logged; protected environments require operator setup.
          test -n "$(printf '%s' "$RELEASE_REFERENCE" | tr -d '[:space:]')" || { echo "::error::A release approval reference is required."; exit 1; }
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" || { echo "::error::Authorized deployment credentials/identifiers are not configured."; exit 1; }
          case "$TARGET" in preview|production) ;; *) echo "::error::Invalid target."; exit 1 ;; esac

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Existing application quality gates
        run: pnpm install --frozen-lockfile && pnpm run typecheck && pnpm run lint && pnpm run validate:api && pnpm run test

      # This workflow never connects to a database or runs migrations; backup/restore,
      # constraint review and target configuration are separately authorized.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull authorized Vercel project settings
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      - name: Build existing Next application
        run: |
          if [ "$TARGET" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy only the authorized target
        id: deploy
        run: |
          if [ "$TARGET" = "production" ]; then
            url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)"
          else
            url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tail -n 1)"
          fi
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Authorized target release"
            echo "- Commit: ${{ github.sha }}"
            echo "- Environment: $TARGET"
            echo "- Target health verification follows; deployment is not backup/TLS/SMS proof."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify exact existing readiness contract without logging bodies
        env:
          RELEASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            if node --input-type=module - <<'JS'
          const response = await fetch(new URL('/api/health', process.env.RELEASE_URL), {signal: AbortSignal.timeout(30000)});
          if (response.status !== 200) process.exit(1);
          const data = await response.json();
          if (data.ok !== true || data.database !== 'postgresql' || data.persistent !== true || data.migration !== '0005_exact_numeric_marks.sql') process.exit(1);
          console.log('Readiness contract passed. The persistent field means DATABASE_URL is present, not backup/durability certification.');
          JS
            then exit 0; fi
            echo "Readiness attempt $attempt did not pass; response bodies suppressed."
            sleep 10
          done
          echo "::error::Target readiness did not pass. Hold traffic and use the approved recovery plan."
          exit 1
