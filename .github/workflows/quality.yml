name: Existing application quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vidya_ci
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: vidya_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vidya_ci -d vidya_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck && pnpm run lint && pnpm run validate:api
      - run: pnpm run test
      - run: pnpm run test:postgres
        env:
          LOCAL_TEST_DATABASE_URL: postgresql://vidya_ci:isolated_ci_only@127.0.0.1:5432/vidya_ci
      - run: pnpm run build
# No production database or deployment secrets are used by this workflow.
